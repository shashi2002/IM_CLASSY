<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IM CLASSY — Real-Time Image Classifier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>IM CLASSY</h1>
    <p class="subtitle">Point your camera at something and see what the model thinks it is — live, right in your browser.</p>
  </header>

  <div id="modelStatus" class="model-status">
    <span id="modelStatusText">Loading model…</span>
    <div class="progress-track">
      <div id="modelProgressBar" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <main class="app-main">
    <nav class="tabs" role="tablist">
      <button id="tabCameraBtn" class="tab-btn active" role="tab" aria-selected="true">Camera</button>
      <button id="tabUploadBtn" class="tab-btn" role="tab" aria-selected="false">Upload Image</button>
    </nav>

    <section id="cameraPanel" class="panel">
      <div class="camera-stage">
        <video id="video" playsinline autoplay muted></video>
        <div id="cameraPlaceholder" class="camera-placeholder">
          <p>Camera is off</p>
        </div>
        <div id="liveBadge" class="live-badge hidden">● LIVE</div>
      </div>

      <div class="camera-controls">
        <button id="startCameraBtn" class="btn btn-primary" disabled>Start Camera</button>
        <button id="stopCameraBtn" class="btn btn-secondary hidden">Stop Camera</button>
        <button id="switchCameraBtn" class="btn btn-ghost hidden" title="Switch between front and back camera">⟳ Switch</button>
      </div>

      <div id="cameraError" class="error-box hidden"></div>

      <div id="liveResults" class="results"></div>
    </section>

    <section id="uploadPanel" class="panel hidden">
      <label id="dropZone" for="fileInput" class="drop-zone">
        <span id="dropZoneText">Click to choose an image, or drag one here</span>
        <input type="file" id="fileInput" accept="image/*" disabled hidden>
      </label>
      <img id="preview" alt="uploaded image">
      <div id="uploadResults" class="results"></div>
    </section>
  </main>

  <canvas id="captureCanvas" hidden></canvas>

  <footer class="app-footer">
    Model runs entirely on-device (WebAssembly/WebGPU) via <a href="https://github.com/xenova/transformers.js" target="_blank" rel="noopener">transformers.js</a> — no images ever leave your browser.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
